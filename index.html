<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F6F5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iPhone : l'app passe sous l'heure et la batterie (voir .status-bar dans src/index.css) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wallo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Icône de l'app (écran d'accueil, onglet du navigateur) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/wallo.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Wallo</title>
    <script>
      // Applique le thème et la couleur avant l'affichage (évite un flash) — voir src/lib/theme.ts
      try {
        var t = JSON.parse(localStorage.getItem('ap.theme') || '"system"');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
        // Couleur de l'app choisie dans Paramètres (voir src/lib/accent.ts)
        var a = JSON.parse(localStorage.getItem('ap.accent') || 'null');
        if (a && a.vars) for (var k in a.vars) document.documentElement.style.setProperty(k, a.vars[k]);
      } catch (e) {}
    </script>
    <meta name="description" content="Tes portefeuilles, dépenses et revenus en $ et en FC, budgets, dettes et ristournes. Gratuit, marche sans internet." />
    <!-- Aperçu du lien partagé (WhatsApp, Messages, Facebook…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wallo" />
    <meta property="og:title" content="Wallo · Gère ton argent simplement" />
    <meta property="og:description" content="Tes portefeuilles, dépenses et revenus en $ et en FC, budgets, dettes et ristournes. Gratuit, marche sans internet." />
    <meta property="og:url" content="https://wallo-b13b0.web.app/" />
    <meta property="og:image" content="https://wallo-b13b0.web.app/icons/icon-512.png" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body class="text-slate-900 antialiased selection:bg-accent/40 selection:text-slate-900 font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
