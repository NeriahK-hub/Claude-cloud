<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F6F5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>AetherPay</title>
    <script>
      // Applique le thème avant l'affichage (évite un flash blanc) — voir src/lib/theme.ts
      try {
        var t = JSON.parse(localStorage.getItem('ap.theme') || '"system"');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <meta name="description" content="Gestion de budget et ristourne." />
  </head>
  <body class="text-slate-900 antialiased selection:bg-lime-200 selection:text-slate-900 font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
